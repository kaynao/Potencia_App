<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <!-- Deixa a barra do navegador na cor roxa no Android/Chrome -->
    <meta name="theme-color" content="#4A148C" />
    <!-- Habilita modo tela cheia ao salvar na tela inicial do iOS/Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

    <meta name="theme-color" content="#3B0944">

    <title>Gestão de Vendas - Açaíteria</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>Gestão de Vendas — Potência do Açaí 🟣</h1>
      </header>

      <!-- PAINEL DE NOVO PEDIDO -->
      <section class="card">
        <h2>Novo Pedido</h2>

        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria">
            <option value="">Selecione...</option>
            <option value="Copos">Copos de Açaí</option>
            <option value="Bebidas">Bebidas</option>
            <option value="Salgados">Salgados</option>
            <option value="Cascão">Açaí - Cascão</option>
            <option value="Barca">Barca</option>
            <option value="Potes">Potes</option>
            <option value="Adicionais">
              Adicionais / Complementos Avulsos
            </option>
          </select>
        </div>

        <div class="form-group row">
          <div>
            <label for="produto">Item / Tamanho</label>
            <select id="produto"></select>
          </div>
          <div class="col-sm">
            <label for="qtd">Qtd</label>
            <input type="number" id="qtd" value="1" min="1" />
          </div>
        </div>

        <!-- ÁREA DE PERSONALIZAÇÃO (CREME + ADICIONAIS DO COPO) -->
        <div class="custom-box" id="box-personalizacao">
          <label class="chk-option">
            <input type="checkbox" id="chk-creme" />
            Adicionar Creme (Açaí + Creme)
          </label>

          <div class="form-group row border-top">
            <div>
              <label for="qtd-extra">Complementos Extras (+ R$ 1,00/un):</label>
            </div>
            <div class="col-sm">
              <input type="number" id="qtd-extra" value="0" min="0" />
            </div>
          </div>

          <h3>Adicionais Especiais no Copo:</h3>
          <div class="adicionais-grid" id="grid-adicionais">
            <!-- Renderizado dinamicamente via JS -->
          </div>
        </div>

        <button type="button" class="btn btn-secondary" id="btn-add-item">
          + Adicionar Item ao Pedido
        </button>

        <hr class="divider" />

        <label>Itens do Pedido Atual:</label>
        <div class="cart-list" id="carrinho"></div>

        <div class="form-group row">
          <div>
            <label for="pagamento">Pagamento</label>
            <select id="pagamento">
              <option value="Pix">PIX</option>
              <option value="Crédito">Crédito</option>
              <option value="Débito">Débito</option>
              <option value="Dinheiro">Dinheiro</option>
            </select>
          </div>
          <div>
            <label for="entrega">Tipo de Entrega</label>
            <select id="entrega">
              <option value="0">Retirada (R$ 0,00)</option>
              <option value="1">Entrega (+ R$ 1,00)</option>
            </select>
          </div>
        </div>

        <div class="total-box">Total: R$ <span id="total-val">0.00</span></div>

        <button class="btn btn-primary" id="btn-finalizar">
          Finalizar Venda
        </button>
      </section>

      <!-- PAINEL DE HISTÓRICO E DADOS -->
      <section class="card">
        <h2>Resumo do Dia</h2>

        <div class="metrics">
          <div class="metric-card">
            <span class="metric-title">Total Faturado</span>
            <span class="metric-value" id="metric-total">R$ 0.00</span>
          </div>
          <div class="metric-card">
            <span class="metric-title">Vendas</span>
            <span class="metric-value" id="metric-qtd">0</span>
          </div>
          <div class="metric-card">
            <span class="metric-title">Entregas</span>
            <span class="metric-value" id="metric-entregas">0</span>
          </div>
        </div>

        <h2>Histórico de Vendas</h2>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Data/Hora</th>
                <th>Pagamento</th>
                <th>Entrega</th>
                <th>Valor</th>
                <th class="text-center">Ação</th>
              </tr>
            </thead>
            <tbody id="historico-corpo"></tbody>
          </table>
        </div>
        <button class="btn btn-secondary mt-15" id="btn-exportar">
          📥 Exportar Dados (CSV)
        </button>
      </section>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
